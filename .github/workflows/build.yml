name: Build Standalone Executables

# 触发：手动触发 workflow，或推送 v*.*.* tag
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller>=6.0

      - name: Build executable
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/build.py --no-install
          echo "---"
          echo "Artifacts:"
          python tools/list_artifacts.py dist

      - name: Package artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path 'hrcloud-migrate.exe' -DestinationPath 'hrcloud-migrate-windows.zip' -Force
          Write-Host "---"
          Write-Host "After packaging:"
          Get-ChildItem | Select-Object Name, @{N='SizeBytes';E={$_.Length}} | Format-Table -AutoSize

      - name: Package artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          tar -czf "hrcloud-migrate-${{ matrix.os }}.tar.gz" hrcloud-migrate
          echo "---"
          echo "After packaging:"
          ls -lh .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrcloud-migrate-${{ matrix.os }}
          path: dist/hrcloud-migrate-*.*

      - name: Attach to release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hrcloud-migrate-*.*