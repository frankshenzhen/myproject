name: Build Standalone Executables

# 触发：手动触发 workflow，或推送 v*.*.* tag
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: doc/data-migrate-tool
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller>=6.0

      - name: Build executable
        run: |
          python tools/build.py --no-install
          echo "---"
          echo "产物："
          ls -lh dist/

      - name: Package artifact
        run: |
          cd dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Windows PowerShell 内置 Compress-Archive
            powershell -NoProfile -Command "Compress-Archive -Path 'hrcloud-migrate/hrcloud-migrate.exe' -DestinationPath 'hrcloud-migrate-windows.zip' -Force"
          else
            tar -czf "hrcloud-migrate-${{ matrix.os }}.tar.gz" hrcloud-migrate
          fi
          echo "---"
          echo "打包后："
          ls -lh .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrcloud-migrate-${{ matrix.os }}
          path: doc/data-migrate-tool/dist/hrcloud-migrate-*.*

      - name: Attach to release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            doc/data-migrate-tool/dist/hrcloud-migrate-*.*